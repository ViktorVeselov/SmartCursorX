name: Codebase Secrets & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Run the deterministic secret scanner
      # Note: This script uses native Node.js libraries (fs, path),
      # so it runs instantly without needing a slow 'npm install' step!
      - name: Scan Codebase for Secrets & Credentials
        run: node .github/scripts/verify-secrets.cjs
