[package]
name = "cursor-replacer-native"
version = "0.1.0"
edition = "2021"
description = "Native performance modules for Cursor Replacer IDE"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi-rs for Node.js bindings
napi = { version = "2", features = ["napi9", "async", "serde-json"] }
napi-derive = "2"

# File search (ripgrep core)
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"  # .gitignore support

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
opt-level = 3
